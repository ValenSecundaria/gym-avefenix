# Backup semanal de la base de Neon: pg_dump comprimido (.sql.gz) subido a un bucket PRIVADO de
# Supabase Storage. Se conservan los últimos KEEP_BACKUPS archivos.
#
# Secrets del repositorio (Settings → Secrets and variables → Actions):
#   DATABASE_URL               conexión de Neon (se usa la directa, sin "-pooler")
#   SUPABASE_URL               https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  clave service_role de Supabase
# Variable opcional (Settings → Variables): BACKUP_BUCKET (por defecto "db-backups"; crearlo como privado).
#
# El volcado tiene datos personales de socios: nunca se guarda como artifact de GitHub.
name: Backup semanal de la base

on:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC = 03:00 en Argentina
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUCKET: ${{ vars.BACKUP_BUCKET || 'db-backups' }}
      KEEP_BACKUPS: "12"
    steps:
      - name: Verificar secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for v in DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret $v"; exit 1; fi
          done

      - name: Instalar pg_dump 17
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17

      - name: Volcar la base
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          DIRECT_URL="${DATABASE_URL/-pooler./.}"
          FILE="gym-avefenix-$(date -u +%Y%m%d-%H%M).sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges "$DIRECT_URL" | gzip -9 > "$FILE"
          test -s "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "Backup generado: $FILE ($(du -h "$FILE" | cut -f1))"

      - name: Subir a Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/gzip" \
            --data-binary "@$FILE" \
            "${SUPABASE_URL%/}/storage/v1/object/$BUCKET/$FILE"
          echo
          echo "Subido a $BUCKET/$FILE"

      - name: Borrar backups viejos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          BASE="${SUPABASE_URL%/}/storage/v1/object"
          AUTH=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
          OLD=$(curl --fail-with-body -sS -X POST "${AUTH[@]}" -H "Content-Type: application/json" \
            -d '{"prefix":"","limit":1000,"sortBy":{"column":"name","order":"desc"}}' \
            "$BASE/list/$BUCKET" | jq -c "[.[] | select(.name | startswith(\"gym-avefenix-\")) | .name] | .[$KEEP_BACKUPS:]")
          if [ "$OLD" != "[]" ]; then
            curl --fail-with-body -sS -X DELETE "${AUTH[@]}" -H "Content-Type: application/json" \
              -d "{\"prefixes\":$OLD}" "$BASE/$BUCKET"
            echo
            echo "Borrados: $OLD"
          else
            echo "Nada para borrar."
          fi
